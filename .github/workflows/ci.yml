# Runs the tests on every push to develop and on pull requests, on Windows (the target) and Linux.
# Upstream removed its own CI on purpose; this one is the fork's. No secrets are used and no AI key is needed.
name: tests
on:
  push:
    branches: [develop]
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run the tests
        run: python tests/run.py
